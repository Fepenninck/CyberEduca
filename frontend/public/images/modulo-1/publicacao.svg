<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Revise o enquadramento</title><desc id="desc">Documento e endereco destacados em uma foto de viagem ficticia.</desc><rect width="960" height="480" fill="#122237"/><circle cx="830" cy="60" r="190" fill="#183149"/><circle cx="100" cy="460" r="160" fill="#173044"/><text x="42" y="48" fill="#7dd3fc" font-size="14" font-family="Arial,sans-serif">CYBEREDUCA+ / SEUS DADOS NA INTERNET</text><rect x="65" y="80" width="555" height="320" rx="18" fill="#1e334b" stroke="#38546e"/><rect x="90" y="105" width="505" height="205" rx="12" fill="#31546c"/><circle cx="494" cy="147" r="28" fill="#fcd34d"/><path d="M90 310L240 161L380 310L475 220L595 310" fill="#4d8390"/><rect x="115" y="270" width="210" height="100" rx="18" fill="#183149" stroke="#38546e"/><text x="137" y="304" fill="#fca5a5" font-size="17" font-family="Arial,sans-serif">DOCUMENTO</text><text x="137" y="341" fill="#e2e8f0" font-size="20" font-family="Arial,sans-serif">EXEMPLO</text><rect x="360" y="295" width="210" height="75" rx="18" fill="#183149" stroke="#38546e"/><text x="378" y="327" fill="#fca5a5" font-size="17" font-family="Arial,sans-serif">ENDERECO</text><text x="378" y="351" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Rua ficticia</text><text x="662" y="150" fill="#b2ff00" font-size="25" font-family="Arial,sans-serif">Antes de postar</text><text x="662" y="205" fill="#e2e8f0" font-size="20" font-family="Arial,sans-serif">1. Reveja a foto</text><text x="662" y="250" fill="#e2e8f0" font-size="20" font-family="Arial,sans-serif">2. Retire os dados</text><text x="662" y="295" fill="#e2e8f0" font-size="20" font-family="Arial,sans-serif">3. Escolha o publico</text><text x="662" y="360" fill="#7dd3fc" font-size="17" font-family="Arial,sans-serif">Copias podem circular.</text><text x="42" y="450" fill="#94a3b8" font-size="13" font-family="Arial,sans-serif">CENARIO FICTICIO / NENHUM DADO REAL</text></svg>