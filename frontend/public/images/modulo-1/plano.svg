<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Tres escolhas de privacidade</title><desc id="desc">Lista de tarefas para revisar coleta, publico e permissoes.</desc><rect width="960" height="480" fill="#122237"/><circle cx="830" cy="60" r="190" fill="#183149"/><circle cx="100" cy="460" r="160" fill="#173044"/><text x="42" y="48" fill="#7dd3fc" font-size="14" font-family="Arial,sans-serif">CYBEREDUCA+ / SEUS DADOS NA INTERNET</text><text x="80" y="105" fill="#b2ff00" font-size="32" font-family="Arial,sans-serif">Seu plano, uma escolha por vez.</text><rect x="80" y="135" width="800" height="78" rx="18" fill="#1e334b" stroke="#38546e"/><rect x="105" y="158" width="30" height="30" rx="8" fill="#122237" stroke="#7dd3fc" stroke-width="2"/><path d="M111 173l7 7 12-16" fill="none" stroke="#b2ff00" stroke-width="3"/><text x="160" y="167" fill="#e2e8f0" font-size="23" font-family="Arial,sans-serif">Revisar um cadastro</text><text x="160" y="194" fill="#94a3b8" font-size="18" font-family="Arial,sans-serif">Quais dados sao realmente necessarios?</text><rect x="80" y="227" width="800" height="78" rx="18" fill="#1e334b" stroke="#38546e"/><rect x="105" y="250" width="30" height="30" rx="8" fill="#122237" stroke="#7dd3fc" stroke-width="2"/><path d="M111 265l7 7 12-16" fill="none" stroke="#b2ff00" stroke-width="3"/><text x="160" y="259" fill="#e2e8f0" font-size="23" font-family="Arial,sans-serif">Escolher o publico</text><text x="160" y="286" fill="#94a3b8" font-size="18" font-family="Arial,sans-serif">Quem precisa ver o que eu publico?</text><rect x="80" y="319" width="800" height="78" rx="18" fill="#1e334b" stroke="#38546e"/><rect x="105" y="342" width="30" height="30" rx="8" fill="#122237" stroke="#7dd3fc" stroke-width="2"/><path d="M111 357l7 7 12-16" fill="none" stroke="#b2ff00" stroke-width="3"/><text x="160" y="351" fill="#e2e8f0" font-size="23" font-family="Arial,sans-serif">Conferir permissoes</text><text x="160" y="378" fill="#94a3b8" font-size="18" font-family="Arial,sans-serif">Qual acesso combina com a funcao?</text><text x="42" y="450" fill="#94a3b8" font-size="13" font-family="Arial,sans-serif">CENARIO FICTICIO / NENHUM DADO REAL</text></svg>