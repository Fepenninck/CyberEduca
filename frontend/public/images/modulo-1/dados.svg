<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Os dados formam um perfil</title><desc id="desc">Nome, contato e local ligados ao perfil ficticio de Ana.</desc><rect width="960" height="480" fill="#122237"/><circle cx="830" cy="60" r="190" fill="#183149"/><circle cx="100" cy="460" r="160" fill="#173044"/><text x="42" y="48" fill="#7dd3fc" font-size="14" font-family="Arial,sans-serif">CYBEREDUCA+ / SEUS DADOS NA INTERNET</text><path d="M360 230L640 130" stroke="#6bd5ef" stroke-width="3" stroke-dasharray="7 7"/><path d="M360 230L640 250" stroke="#6bd5ef" stroke-width="3" stroke-dasharray="7 7"/><path d="M360 230L640 370" stroke="#6bd5ef" stroke-width="3" stroke-dasharray="7 7"/><rect x="80" y="105" width="320" height="280" rx="18" fill="#1e334b" stroke="#38546e"/><circle cx="240" cy="185" r="46" fill="#7dd3fc"/><path d="M165 298a75 75 0 0 1 150 0" fill="#7dd3fc"/><text x="200" y="344" fill="#e2e8f0" font-size="26" font-family="Arial,sans-serif">ANA</text><rect x="540" y="80" width="365" height="92" rx="18" fill="#1e334b" stroke="#38546e"/><text x="566" y="116" fill="#b2ff00" font-size="24" font-family="Arial,sans-serif">Nome</text><text x="566" y="148" fill="#e2e8f0" font-size="18" font-family="Arial,sans-serif">Como voce se identifica</text><rect x="540" y="192" width="365" height="92" rx="18" fill="#1e334b" stroke="#38546e"/><text x="566" y="228" fill="#b2ff00" font-size="24" font-family="Arial,sans-serif">Contato</text><text x="566" y="260" fill="#e2e8f0" font-size="18" font-family="Arial,sans-serif">Como podem falar com voce</text><rect x="540" y="304" width="365" height="92" rx="18" fill="#1e334b" stroke="#38546e"/><text x="566" y="340" fill="#b2ff00" font-size="24" font-family="Arial,sans-serif">Local</text><text x="566" y="372" fill="#e2e8f0" font-size="18" font-family="Arial,sans-serif">Onde voce costuma estar</text><text x="42" y="450" fill="#94a3b8" font-size="13